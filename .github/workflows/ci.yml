name: OSAF Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Run Ruff (Code Linting)
        run: |
          ruff check .

      - name: Run Full Test Suite & Coverage (Security + Insurance modules)
        env:
          GEMINI_API_KEY: "dummy-key-for-ci"
        run: |
          PYTHONPATH=. pytest -v --cov=. --cov-report=term-missing

      - name: Run OSAF Pentest Agent Tests (explicit, for visibility)
        env:
          GEMINI_API_KEY: "dummy-key-for-ci"
        run: |
          PYTHONPATH=. pytest tests/ -v -k "not claim and not insurance"

      - name: Run Insurance Claims Triage Agent Tests (explicit, for visibility)
        env:
          GEMINI_API_KEY: "dummy-key-for-ci"
        run: |
          PYTHONPATH=. pytest tests/test_claim_fraud_scorer.py tests/test_insurance_claims_agent.py -v

      - name: Insurance CLI Smoke Test (end-to-end, JSON-driven examples)
        env:
          GEMINI_API_KEY: "dummy-key-for-ci"
        run: |
          python3 insurance_cli.py --list-samples
          python3 insurance_cli.py --claim examples/claims/auto_high_risk.json
          python3 insurance_cli.py --claim examples/claims/travel_medium_risk.json
          python3 insurance_cli.py --claim examples/claims/health_low_risk.json

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Test Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: offensive-automation-framework:latest
